name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        # Git Bash on Windows, so every runner runs the same commands with pipefail and tee.
        shell: bash
    env:
      # UTF-8 mode (the default from Python 3.15, PEP 686): Windows otherwise writes output in
      # cp1252, and tools printing characters such as the arrows in the import-linter
      # contract names fail with UnicodeEncodeError.
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        # Windows checks that content IDs match across line endings and path separators
        # (ADR 0013) on a real Windows checkout, not only in simulation.
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Add "3.15" once the dependency stack supports it.
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-packages --locked
      - name: Install make on Windows
        if: runner.os == 'Windows'
        run: command -v make || choco install make --no-progress --yes
      - run: make lint
      - run: make typecheck
      - name: Run the tests
        env:
          # Short tracebacks and a summary of failures and errors, so the log tail says why.
          PYTEST_ADDOPTS: -rfE --tb=short
        run: |
          set -o pipefail
          make test 2>&1 | tee pytest.log
      - name: Report failures as annotations
        if: failure()
        run: |
          grep -E '^(FAILED|ERROR) ' pytest.log | head -n 20 | sed 's/^/::error title=pytest::/' || true
          { echo '```'; tail -n 80 pytest.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  postgres:
    name: Postgres storage tests
    # testcontainers needs Docker, which only the Linux runners provide.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Fail rather than skip if Docker is missing, so this job always proves Postgres works.
      CONVEYOR_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --all-packages --locked
      - name: Run the Postgres tests
        run: |
          set -o pipefail
          uv run pytest -m postgres -vv -rfE --tb=short 2>&1 | tee pytest.log
      - name: Report failures as annotations
        if: failure()
        run: |
          grep -E '^(FAILED|ERROR) ' pytest.log | head -n 20 | sed 's/^/::error title=pytest::/' || true
          { echo '```'; tail -n 80 pytest.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  ui:
    name: UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm -C ui install --frozen-lockfile
      - run: make ui-check

  actions-security:
    name: Workflow security (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
