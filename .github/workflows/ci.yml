name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Add "3.15" once the dependency stack supports it.
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: make lint
      - run: make typecheck
      - name: Run the tests
        env:
          # Short tracebacks and a summary of failures and errors, so the log tail says why.
          PYTEST_ADDOPTS: -rfE --tb=short
        run: |
          set -o pipefail
          make test 2>&1 | tee pytest.log
      - name: Report failures as annotations
        if: failure()
        run: |
          grep -E '^(FAILED|ERROR) ' pytest.log | head -n 20 | sed 's/^/::error title=pytest::/' || true
          { echo '```'; tail -n 80 pytest.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  postgres:
    name: Postgres storage tests
    # testcontainers needs Docker, which only the Linux runners provide.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Fail rather than skip if Docker is missing, so this job always proves Postgres works.
      CONVEYOR_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --all-packages --locked
      - name: Run the Postgres tests
        run: |
          set -o pipefail
          uv run pytest -m postgres -vv -rfE --tb=short 2>&1 | tee pytest.log
      - name: Report failures as annotations
        if: failure()
        run: |
          grep -E '^(FAILED|ERROR) ' pytest.log | head -n 20 | sed 's/^/::error title=pytest::/' || true
          { echo '```'; tail -n 80 pytest.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  ui:
    name: UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm -C ui install --frozen-lockfile
      - run: make ui-check

  actions-security:
    name: Workflow security (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
