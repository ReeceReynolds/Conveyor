# yaml-language-server: $schema=../../../../schemas/agent.schema.json
name: implementer

brief:
  instructions: prompt.md
  input: contracts.TaskList
  output: contracts.CodeChanges

capabilities:
  model:
    provider: openrouter
    id: anthropic/claude-sonnet
    temperature: 0.0
    routing: { only: [anthropic], allow_fallbacks: false }
  tools: []
  permissions: { network: false, secrets: [] }

quality_gate:
  suite: evals
  min_pass_rate: 0.9
  repeats: 3
