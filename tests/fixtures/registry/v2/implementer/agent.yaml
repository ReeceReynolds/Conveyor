# yaml-language-server: $schema=../../../../../schemas/agent.schema.json
name: implementer

brief:
  instructions: prompt.md
  input: contracts.TaskList
  output: contracts.CodeChanges

capabilities:
  model:
    provider: openrouter
    id: openai/gpt-5
    temperature: 0.2
    routing: { only: [openai], allow_fallbacks: false }
  tools: [repo.read_file, github.create_pull_request]
  permissions: { network: true, secrets: [GITHUB_TOKEN] }

quality_gate:
  suite: evals
  min_pass_rate: 0.9
  repeats: 3
